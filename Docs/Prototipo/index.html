<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fidelix Prototipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Concepto: app móvil centrada (390px) con tres roles; sistema visual idéntico al kit de Figma de Fidelix. */
:root{
  --brand:#2563EB; --brand-dark:#1D4ED8; --brand-soft:#E8F0FE;
  --bg:#F4F7FB; --surface:#FFFFFF; --muted:#EDF1F7; --ground:#DDE5F0;
  --ink:#0F172A; --ink2:#475569; --ink3:#8A97AB; --on-brand:#FFFFFF;
  --line:#D9E1EC; --ok:#16A34A; --ok-soft:#DCFCE7; --bad:#DC2626; --bad-soft:#FEE2E2; --warn:#B45309; --warn-soft:#FEF3C7;
  --overlay:rgba(15,23,42,.55);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#5B8DEF; --brand-dark:#7BA3F3; --brand-soft:#1B2A4A;
  --bg:#0B1220; --surface:#131C2E; --muted:#1A2438; --ground:#070C16;
  --ink:#E8EEF8; --ink2:#A9B6CA; --ink3:#7C8AA3; --on-brand:#0B1220;
  --line:#26324A; --ok:#4ADE80; --ok-soft:#12351F; --bad:#F87171; --bad-soft:#3B1717; --warn:#FBBF24; --warn-soft:#3A2D0B;
  --overlay:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#5B8DEF; --brand-dark:#7BA3F3; --brand-soft:#1B2A4A;
  --bg:#0B1220; --surface:#131C2E; --muted:#1A2438; --ground:#070C16;
  --ink:#E8EEF8; --ink2:#A9B6CA; --ink3:#7C8AA3; --on-brand:#0B1220;
  --line:#26324A; --ok:#4ADE80; --ok-soft:#12351F; --bad:#F87171; --bad-soft:#3B1717; --warn:#FBBF24; --warn-soft:#3A2D0B;
  --overlay:rgba(0,0,0,.65); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
.app{position:relative;max-width:430px;min-height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){.app{min-height:min(880px,100%);margin-block:0;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.18)}}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .t{flex:1;min-width:0}
.top h1{margin:0;font-size:18px;font-weight:600;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;color:var(--ink3);font-size:12px;line-height:16px}
.ib{border:0;background:none;padding:6px;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink2)}
.ib:hover{background:var(--muted)} .ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av{width:36px;height:36px;border-radius:99px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.av.lg{width:72px;height:72px;font-size:22px}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:16px}
main.center{justify-content:center;padding-inline:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:left;color:inherit}
.row:last-child{border-bottom:0}
button.row{cursor:pointer} button.row:hover{background:var(--muted)}
.row .g{flex:1;min-width:0} .row b{display:block;font-weight:600} .row small{color:var(--ink3);font-size:12px;display:block}
.pos{color:var(--ok);font-weight:600;white-space:nowrap}.neg{color:var(--bad);font-weight:600;white-space:nowrap}
h2{margin:0;font-size:18px;font-weight:600;line-height:24px} h3{margin:0;font-size:15px;font-weight:600}
p{margin:0}.sub{color:var(--ink2)}.mut{color:var(--ink3);font-size:12px}
.btn{border:1px solid transparent;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;width:100%;display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:44px}
.btn:focus-visible,.chip:focus-visible,.ib:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn.p{background:var(--brand);color:var(--on-brand)} .btn.p:hover{background:var(--brand-dark)}
.btn.s{background:var(--brand-soft);color:var(--brand)} .btn.g{background:transparent;color:var(--brand);border-color:var(--line)}
.btn.d{background:var(--bad);color:#fff} .btn.sm{padding:6px 12px;min-height:34px;font-size:13px;width:auto;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:13px;font-weight:500;color:var(--ink2)}
.fld input,.fld select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;width:100%;min-height:46px}
.fld.err input{border-color:var(--bad)} .fld .e{color:var(--bad);font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-w{background:var(--warn-soft);color:var(--warn)}.b-n{background:var(--muted);color:var(--ink2)}.b-d{background:var(--bad-soft);color:var(--bad)}
.hero{background:var(--brand);color:var(--on-brand);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:6px}
.hero .big{font-size:44px;line-height:52px;font-weight:700;font-variant-numeric:tabular-nums}
.hero .top2{display:flex;justify-content:space-between;align-items:center}
.hero .badge{background:var(--warn-soft);color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>*{min-width:0}
input[type=date]{min-width:0;width:100%;max-width:100%}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat small{color:var(--ink3);font-size:12px;display:block}.stat b{font-size:24px;line-height:30px;font-variant-numeric:tabular-nums}
.logo{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.logo i{width:72px;height:72px;border-radius:24px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:700 28px var(--font);font-style:normal}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--muted);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:none;border-radius:9px;padding:8px;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ico{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.code{font-size:32px;font-weight:700;color:var(--brand);letter-spacing:.04em;text-align:center}
.okc{width:80px;height:80px;border-radius:99px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin-inline:auto}
.okc svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px}.kv span{color:var(--ink2)}.kv b{text-align:right}
.ov{position:absolute;inset:0;background:var(--overlay);z-index:20;display:flex;animation:f .15s}
.drawer{width:290px;max-width:86%;background:var(--surface);height:100%;padding:24px 16px;display:flex;flex-direction:column;gap:4px;animation:s .2s}
.drawer .nv{border:0;background:none;text-align:left;padding:12px 16px;border-radius:12px;font-weight:500;color:var(--ink2);cursor:pointer}
.drawer .nv.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.modal{margin:auto 24px;background:var(--surface);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px;width:100%}
.ov.m{align-items:center}
.toast{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:30;font-size:14px;animation:f .2s}
@keyframes f{from{opacity:0}to{opacity:1}} @keyframes s{from{transform:translateX(-30px)}to{transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
svg.ch text{fill:var(--ink3);font-size:10px;font-family:var(--font)} svg.ch .gl{stroke:var(--line)} svg.ch .b1{fill:var(--brand)} svg.ch .b2{fill:var(--ok)}
.lg2{display:flex;gap:16px;font-size:12px;color:var(--ink2)}.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.ft{padding:8px 16px 16px;text-align:center;color:var(--ink3);font-size:12px}
.link{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:8px}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
(function(){
const DAY=864e5; let offset=0; const now=()=>Date.now()+offset;
const fmtD=t=>new Date(t).toLocaleDateString('es-AR',{day:'2-digit',month:'short',year:'numeric'});
const fmtN=n=>Number(n).toLocaleString('es-AR');
const fmtM=n=>'$ '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uid=100; const nid=()=>++uid;

/* ---------- Base de datos simulada ---------- */
const db={cats:{'Estándar':1,Gold:1.5},dias:15,reglas:[{id:1,ppm:0.01,desde:Date.now()-400*DAY,vig:365},{id:2,ppm:0.02,desde:Date.now()+30*DAY,vig:365}],
 admin:{email:'admin@fidelix.local',pass:'Admin123!',nombre:'Administrador'},
 empleados:[{id:1,nombre:'Empleado Demo',doc:'30111222',email:'empleado@fidelix.local',pass:'Empleado123!',activo:true},{id:2,nombre:'Empleado Inactivo',doc:'30333444',email:'empleado.inactivo@fidelix.local',pass:'Inactivo123!',activo:false}],
 productos:[{id:1,nombre:'Remera básica',cat:'Indumentaria',precio:8500,activo:true},{id:2,nombre:'Jean clásico',cat:'Indumentaria',precio:24000,activo:true},{id:3,nombre:'Zapatillas urbanas',cat:'Calzado',precio:58000,activo:true},{id:4,nombre:'Campera liviana',cat:'Indumentaria',precio:42000,activo:true},{id:5,nombre:'Gorra',cat:'Accesorios',precio:6500,activo:true}],catProd:['Indumentaria','Calzado','Accesorios','Otros'],catBen:['Descuento','Producto gratis','Experiencia','Otro'],clientes:[],lotes:[],movs:[],canjes:[],audit:[],
 beneficios:[
  {id:1,nombre:'Cupón $20.000',cat:'Descuento',costo:200,activo:true},
  {id:2,nombre:'Café gratis',cat:'Producto gratis',costo:80,activo:true},
  {id:3,nombre:'15% de descuento',cat:'Descuento',costo:350,activo:true},
  {id:4,nombre:'Pack regalo',cat:'Producto gratis',costo:2500,activo:true},
  {id:5,nombre:'Entrada VIP',cat:'Experiencia',costo:4000,activo:true}]};
const today=new Date();
const mkC=(id,nombre,doc,email,cat,nac,tel,pw)=>db.clientes.push({id,nombre,doc,email,cat,nac,tel:tel||'',pass:pw||'Cliente123!',activo:true,alta:now()-90*DAY});
mkC(1,'Cliente Demo','40333444','cliente.demo@fidelix.local','Estándar','1994-06-14','+54 9 3493 555 0123');
mkC(2,'Cliente Inactivo','54433304','cliente.inactivo@fidelix.local','Estándar','1988-02-09','','Inactivo123!');db.clientes[1].activo=false;
mkC(3,'Cliente Gold','40111222','cliente.gold@fidelix.local','Gold',`1990-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`,'','Gold1234!');
mkC(4,'Carlos Ruiz','30447126','carlos@email.com','Estándar','1985-11-21');
mkC(5,'Ana Torres','38215640','ana@email.com','Estándar','1999-08-30');
function audit(quien,accion){db.audit.unshift({id:nid(),quien,accion,fecha:now()})}
function acumular(cid,pts,desc,at,{inmediato=false,vence,emp}={}){
  at=at??now(); db.lotes.push({id:nid(),cid,rest:pts,disp:inmediato?at:at+db.dias*DAY,vence:vence??at+((reglaAt(at)||db.reglas[0]).vig)*DAY});
  db.movs.push({id:nid(),cid,tipo:desc==='Bono de cumpleaños'?'Bono':'Acumulación',pts,desc,fecha:at,emp});}


/* ---------- Reglas de negocio ---------- */
const defCat=()=>Object.entries(db.cats).sort((a,b)=>a[1]-b[1])[0][0];
const prod=id=>db.productos.find(p=>p.id===id);
const cartTotal=()=>S.cart.reduce((t,i)=>{const p=prod(i.pid);return t+(p?p.precio*i.qty:0)},0);
const cli=id=>db.clientes.find(c=>c.id===id);
const saldo=id=>db.lotes.filter(l=>l.cid===id&&l.disp<=now()&&l.vence>now()).reduce((s,l)=>s+l.rest,0);
const pendiente=id=>db.lotes.filter(l=>l.cid===id&&l.disp>now()&&l.vence>now()).reduce((s,l)=>s+l.rest,0);
const porVencer=id=>db.lotes.filter(l=>l.cid===id&&l.disp<=now()&&l.vence>now()&&l.vence<=now()+30*DAY).reduce((s,l)=>s+l.rest,0);
const reglaAt=t=>db.reglas.filter(r=>r.desde<=t).sort((a,b)=>b.desde-a.desde)[0]||null;
const puntosPorMonto=(monto,cat)=>{const r=reglaAt(now());return r?Math.round(monto*r.ppm*db.cats[cat]):0;};
const pesosPorPunto=()=>{const r=reglaAt(now());return r?Math.round(100/r.ppm)/100:null;};
const isAcu=m=>m.tipo==='Acumulación'||m.tipo==='Bono';
const iso=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dStart=x=>x?new Date(x+'T00:00:00').getTime():null;
const dEnd=x=>x?new Date(x+'T23:59:59').getTime():null;
const inRange=(t,a,b)=>(a==null||t>=a)&&(b==null||t<=b);
function doCanje(cid,bid,presencial,at,estado='Pendiente'){
  const b=db.beneficios.find(x=>x.id===bid),c=cli(cid); at=at??now();
  if(!b||!b.activo)return {error:'El beneficio no está disponible.'};
  const cur=at===now()?now():at;
  if(at>=now()-1000&&saldo(cid)<b.costo)return {error:'Saldo insuficiente.'};
  let need=b.costo;
  db.lotes.filter(l=>l.cid===cid&&l.disp<=cur&&l.vence>cur&&l.rest>0).sort((a,z)=>a.vence-z.vence).forEach(l=>{const t=Math.min(l.rest,need);l.rest-=t;need-=t;});
  const k={id:nid(),cid,bid,nombre:b.nombre,pts:b.costo,codigo:'CJ-'+Math.floor(1000+Math.random()*9000)+'-'+(10+db.canjes.length),estado,fecha:at,presencial};
  db.canjes.push(k);db.movs.push({id:nid(),cid,tipo:'Canje',pts:-b.costo,desc:'Canje – '+b.nombre,fecha:at});
  if(at>=now()-1000)audit(presencial?'Empleado':c.nombre,`Canje ${b.nombre} (${c.nombre})`);
  return {canje:k};
}
function ejecutarVencimiento(){let n=0,pts=0;db.lotes.forEach(l=>{if(l.vence<=now()&&l.rest>0){db.movs.push({id:nid(),cid:l.cid,tipo:'Vencimiento',pts:-l.rest,desc:'Vencimiento de puntos',fecha:now()});pts+=l.rest;n++;l.rest=0;}});audit('Administrador',`Proceso vencimiento: ${n} lotes, ${pts} pts`);return {n,pts};}
function ejecutarBono(){let n=0;const t=new Date(now());db.clientes.filter(c=>c.activo).forEach(c=>{const [,m,d]=c.nac.split('-').map(Number);const ya=db.movs.some(x=>x.cid===c.id&&x.desc==='Bono de cumpleaños'&&new Date(x.fecha).getFullYear()===t.getFullYear());if(m===t.getMonth()+1&&d===t.getDate()&&!ya){acumular(c.id,100,'Bono de cumpleaños',now(),{inmediato:true});n++;}});audit('Administrador',`Proceso bono cumpleaños: ${n} clientes`);return {n};}

(function seed(){
  let r=7; const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  db.clientes.forEach(c=>{const n=c.id===1?9:6;for(let i=0;i<n;i++){const ago=Math.floor(rnd()*140)+(c.id===1&&i===0?3:20);const pts=Math.round((20+rnd()*90)*db.cats[c.cat]);acumular(c.id,pts,'Compra – Tienda',now()-ago*DAY);}});
  acumular(1,65,'Compra – Tienda',now()-3*DAY);
  acumular(1,85,'Compra – Tienda',now()-300*DAY,{vence:now()+20*DAY});
  db.movs.sort((a,b)=>a.fecha-b.fecha);
  doCanje(1,1,false,now()-30*DAY,'Entregado');doCanje(2,2,false,now()-12*DAY,'Entregado');doCanje(1,2,false,now()-6*DAY,'Pendiente');doCanje(3,3,true,now()-2*DAY,'Pendiente');
  db.audit=[];audit('Sistema','Base de demostración cargada');
})();
/* ---------- Estado de la UI ---------- */
const S={role:null,uid:null,view:'login',stack:[],p:{},drawer:false,modal:null,toast:null,loginRole:'Cliente',err:{},f:{},q:'',chip:'Todos',flt:{},rec:null,pos:{c:null},sim:{c:null},period:30,cart:[],pq:''};
const NAV={Cliente:[['home','Mis puntos'],['beneficios','Beneficios'],['historial','Historial'],['canjes','Mis canjes'],['perfil','Mi perfil']],
 Empleado:[['pos','Punto de venta'],['canjePres','Canje presencial'],['canjesHist','Historial de canjes'],['clientesEmp','Clientes'],['crearCliente','Nuevo cliente']],
 Admin:[['dash','Dashboard'],['clientes','Clientes'],['empleados','Empleados'],['benAdm','Beneficios'],['productos','Productos'],['categorias','Categorías'],['movs','Movimientos'],['reportes','Reportes'],['reglas','Reglas de acumulación'],['procesos','Procesos programados'],['auditoria','Auditoría']]};
const TITLES={movs:'Movimientos',reportes:'Reportes',reglas:'Reglas de acumulación',reglaNew:'Nueva regla',reglaEdit:'Editar regla',auditDet:'Detalle de auditoría',cobertura:'Cobertura de requerimientos',home:'Tienda',beneficios:'Beneficios',historial:'Historial',canjes:'Mis canjes',perfil:'Mi perfil',pos:'Punto de venta',canjePres:'Canje presencial',canjesHist:'Historial de canjes',crearCliente:'Nuevo cliente',dash:'Dashboard',clientes:'Clientes',empleados:'Empleados',benAdm:'Beneficios',procesos:'Procesos y reglas',auditoria:'Auditoría',registro:'Crear cuenta',rec1:'Recuperar contraseña',rec2:'Verificar código',rec3:'Nueva contraseña',prodEdit:'Editar producto',benEdit:'Editar beneficio',empEdit:'Editar empleado',cliEdit:'Editar cliente',clientesEmp:'Clientes',categorias:'Categorías',catNew:'Nueva categoría',catEdit:'Editar categoría',cambioPass:'Cambiar contraseña',canjeOk:'Canje',clienteDet:'Cliente',empNew:'Crear empleado',productos:'Productos',prodNew:'Crear producto',cliNew:'Crear cliente',benNew:'Crear beneficio'};
const ROOTS=new Set(Object.values(NAV).flat().map(x=>x[0]));
const user=()=>S.role==='Cliente'?cli(S.uid):S.role==='Empleado'?db.empleados.find(e=>e.id===S.uid):db.admin;
const initials=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
function go(view,p={}){S.f={};S.flt={};if(!ROOTS.has(S.view)||!ROOTS.has(view)){}S.stack.push({view:S.view,p:S.p,chip:S.chip});S.view=view;S.p=p;S.drawer=false;S.err={};S.chip='Todos';S.q='';S.sim={c:null};S.cart=[];S.pq='';if(ROOTS.has(view)){S.stack=[];}render();window.scrollTo(0,0);}
function back(){const b=S.stack.pop();if(b){S.f={};S.flt={};S.view=b.view;S.p=b.p;S.chip=b.chip||'Todos';S.err={};S.q='';render();}}
function toast(t){S.toast=t;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast=null;const e=document.querySelector('.toast');if(e)e.remove();},2600);}

function stats(days){const from=now()-days*DAY;return {cli:db.clientes.filter(c=>c.activo).length,acu:db.movs.filter(m=>isAcu(m)&&m.fecha>=from).reduce((s,m)=>s+m.pts,0),can:db.canjes.filter(k=>k.fecha>=from).length,ven:Math.abs(db.movs.filter(m=>m.tipo==='Vencimiento'&&m.fecha>=from).reduce((s,m)=>s+m.pts,0))};}
function chart(){const M=[];for(let i=4;i>=0;i--){const d=new Date(now());d.setDate(1);d.setMonth(d.getMonth()-i);M.push({y:d.getFullYear(),m:d.getMonth(),a:0,c:0});}
 db.movs.forEach(x=>{const d=new Date(x.fecha);const k=M.find(m=>m.y===d.getFullYear()&&m.m===d.getMonth());if(!k)return;if(isAcu(x))k.a+=x.pts;if(x.tipo==='Canje')k.c+=-x.pts;});
 const max=Math.max(100,...M.map(m=>Math.max(m.a,m.c)));const top=Math.ceil(max/100)*100,W=300,H=130,x0=34;const sc=v=>H-(v/top)*H+10;
 const nm=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
 return `<svg class="ch" viewBox="0 0 320 170" role="img" aria-label="Puntos acumulados y canjeados por mes">${[0,.5,1].map(f=>{const v=Math.round(top*f);return `<line class="gl" x1="${x0}" x2="${x0+W-14}" y1="${sc(v)}" y2="${sc(v)}"/><text x="${x0-6}" y="${sc(v)+3}" text-anchor="end">${fmtN(v)}</text>`}).join('')}
 ${M.map((m,i)=>{const bx=x0+10+i*54;return `<rect class="b1" x="${bx}" y="${sc(m.a)}" width="18" height="${H+10-sc(m.a)}" rx="3"/><rect class="b2" x="${bx+21}" y="${sc(m.c)}" width="18" height="${H+10-sc(m.c)}" rx="3"/><text x="${bx+20}" y="${H+28}" text-anchor="middle">${nm[m.m]}</text>`}).join('')}</svg>`;}

const nacOk=b=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(b);if(!m)return false;const t=new Date(now()),y=+m[1],mo=+m[2],d=+m[3];if(new Date(y,mo-1,d)>t)return false;let a=t.getFullYear()-y;if(t.getMonth()+1<mo||(t.getMonth()+1===mo&&t.getDate()<d))a--;return a>=18&&a<=120;};

 chkNum(o,'ppm',val('ppm'),{maxInt:2,maxDec:2});if(!S.err.ppm&&(p<0.01||p>99.99))need(o,'ppm','Tiene que estar entre 0,01 y 99,99.');
 if(!val('desde'))need(o,'desde','Ingresá la fecha de vigencia.');else if(db.reglas.some(x=>x.id!==excl&&iso(x.desde)===val('desde')))need(o,'desde','Ya existe una regla que entra en vigencia en esa fecha.');
 chkNum(o,'vig',val('vig'),{maxInt:3,maxDec:0});if(!S.err.vig&&(v<30||v>730))need(o,'vig','Tiene que estar entre 30 y 730 días.');if(val('desde')&&!S.err.desde&&d<dStart(iso(now())))need(o,'desde','La fecha de vigencia no puede ser anterior a hoy.');return {o,p,v,d};};

/* CU-20 · movimientos del sistema + comparación de períodos (RF-16, RN-06) */
const IND=['Todos','Ventas','Canjes','Puntos otorgados'];
const rangoDias=(a,b)=>{const r=[];for(let t=dStart(a);t<=dStart(b);t+=DAY)r.push(t);return r;};
const medir=(ind,a,b)=>rangoDias(a,b).map(t=>{const m=db.movs.filter(x=>inRange(x.fecha,t,t+DAY-1));
 return ind==='Ventas'?m.filter(x=>isAcu(x)&&x.desc.startsWith('Compra')).length:ind==='Canjes'?m.filter(x=>x.tipo==='Canje').length:m.filter(isAcu).reduce((s,x)=>s+x.pts,0);});
const barras=v=>{const mx=Math.max(1,...v);return `<div style="display:flex;align-items:flex-end;gap:1px;height:64px" role="img" aria-label="Valor por día">${v.map(n=>`<i style="flex:1;min-width:1px;height:${Math.max(2,Math.round(n/mx*100))}%;background:var(--ink);opacity:.55"></i>`).join('')}</div>`;};
const cmpCard=()=>{const f=S.flt;let out='';if(f.cmp){
  const ser=[];const add=(n,a,b)=>{const v=medir(n,a,b);ser.push({t:(n==='Puntos otorgados'?'Puntos otorgados':n)+' · '+a+' a '+b,v});};
  if(f.ind==='Todos'){['Ventas','Canjes','Puntos otorgados'].forEach(n=>add(n,f.a0,f.a1));}
  else{add(f.ind,f.a0,f.a1);if(f.b0&&f.b1)add(f.ind,f.b0,f.b1);}
  out=ser.map(x=>`<div class="card" style="gap:8px"><div class="kv"><b>${esc(x.t)}</b><span>Total ${fmtN(x.v.reduce((a,b)=>a+b,0))}</span></div><small class="mut">${x.v.length} día(s) · valor por día</small>${barras(x.v)}</div>`).join('');}
 return `<div class="card" style="gap:12px">${sel('ind','Indicador',IND,f.ind||'Todos')}<div class="two">${fld('a0','Período 1 desde',{type:'date',val:f.a0||''})}${fld('a1','Período 1 hasta',{type:'date',val:f.a1||''})}</div><div class="two">${fld('b0','Período 2 desde (opcional)',{type:'date',val:f.b0||''})}${fld('b1','Período 2 hasta (opcional)',{type:'date',val:f.b1||''})}</div><small class="mut">Ventas = cantidad de compras. El segundo período solo se puede usar cuando se elige un solo indicador.</small>${btn('cmpRun','Comparar','s')}</div>${out}`;};
V.movs=()=>{const f=S.flt,a=dStart(f.d0),b=dEnd(f.d1);const names=['Todos los clientes',...db.clientes.map(c=>c.nombre+' · '+c.doc)];
 const cid=f.cli&&f.cli!==names[0]?db.clientes.find(c=>c.nombre+' · '+c.doc===f.cli):null;

/* CU-24 · reportes (RF-23, RN-19) */
const REP=['Resumen','Beneficios más canjeados'];
function genRep(tipo,a,b){const m=db.movs.filter(x=>inRange(x.fecha,a,b));let cols,rows;
 if(tipo===REP[0]){cols=['Indicador','Puntos'];const sm=f=>m.filter(f).reduce((t,x)=>t+x.pts,0);
  rows=m.length?[['Puntos acumulados',sm(x=>x.tipo==='Acumulación')],['Bonos de cumpleaños',sm(x=>x.tipo==='Bono')],['Puntos canjeados',-sm(x=>x.tipo==='Canje')],['Puntos vencidos',-sm(x=>x.tipo==='Vencimiento')]]:[];}
 else{cols=['Beneficio','Canjes','Puntos'];const t={};db.canjes.filter(k=>inRange(k.fecha,a,b)).forEach(k=>{const z=t[k.nombre]=t[k.nombre]||[0,0];z[0]++;z[1]+=k.pts;});rows=Object.entries(t).map(([n,z])=>[n,z[0],z[1]]).sort((x,y)=>y[1]-x[1]);}
 return {cols,rows,au:db.audit.filter(x=>inRange(x.fecha,a,b)).length};}
V.reportes=()=>{const r=S.flt.rep;let out='';if(r){const g=genRep(r.tipo,dStart(r.a),dEnd(r.b));
  out=g.rows.length?`<div class="card" style="gap:8px"><h3>${esc(r.tipo)}</h3><small class="mut">${esc(g.cols.join(' · '))}</small><div class="list">${g.rows.slice(0,40).map(x=>`<div class="row"><div class="g"><b>${esc(x[0])}</b><small>${x.slice(1).map(esc).join(' · ')}</small></div></div>`).join('')}</div><small class="mut">${g.rows.length} fila(s) · ${g.au} registro(s) de auditoría en el período (dato informativo, RN-19).</small>${btn('csv',S.flt.csvOn?'Ocultar CSV':'Exportar CSV (formato=Csv)','s')}${S.flt.csvOn?`<textarea readonly rows="8" aria-label="Reporte en formato CSV" style="width:100%;font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink)">${esc([g.cols,...g.rows].map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'))}</textarea><small class="mut">Seleccioná y copiá el contenido para pegarlo en una planilla.</small>`:''}</div>`:empty('No hay datos disponibles para el período seleccionado.');}
 return `<main><div class="card" style="gap:12px">${sel('rtipo','Tipo de reporte',REP,S.f.rtipo||(r?r.tipo:REP[0]))}<div class="two">${dateIn('d0','Período desde')}${dateIn('d1','Período hasta')}</div>${btn('genRep','Generar reporte','p')}</div>${out}</main>`;};

setInterval(()=>{if(S.view!=='login'||!S.lock)return;const l=lockLeft(S.lock);if(l<=0){S.lock=null;render();return;}const e=document.getElementById('lockcd');if(e)e.textContent=fmtLock(l);},500);
const need=(o,id,msg)=>{S.err[id]=msg;o.bad=true;};
function chkNum(o,id,raw,{maxInt=10,maxDec=2,pos=true,msg}={}){
  const m0=msg||'Debe ser mayor a 0.';
  if(raw==='')return need(o,id,'Ingresá un valor.');
  if(/,/.test(raw))return need(o,id,'Usá punto (.) como separador decimal, no coma.');
  if(!/^-?\d+(\.\d+)?$/.test(raw))return need(o,id,'Ingresá solo números (ej. 1500 o 0.25).');
  if(raw[0]==='-')return need(o,id,'No puede ser negativo.');
  const [ent,dec='']=raw.split('.');const ei=ent.replace(/^0+(?=\d)/,'');
  if(ei.length>maxInt)return need(o,id,'Máximo '+maxInt+' dígitos enteros.');
  if(dec.length>maxDec)return need(o,id,maxDec===0?'Debe ser un número entero.':'Máximo '+maxDec+' decimales (no se redondea).');
  if(pos&&!(Number(raw)>0))return need(o,id,m0);
}
